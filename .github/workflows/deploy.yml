name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject CARTO API key
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          grep -rl "__CARTO_API_KEY_PROD__" --include="*.js" --exclude-dir=node_modules . \
            | xargs sed -i "s/__CARTO_API_KEY_PROD__/${CARTO_API_KEY}/g"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
